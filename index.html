<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0c111d">
  <title>Finanzkompass</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Kompass">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <div class="app" id="app">
    <header class="kopf">
      <h1><span id="titel">Kompass</span><small id="stand"></small></h1>
      <div class="kopf-rechts">
        <span class="serie" id="serie" hidden></span>
        <button class="rund" id="menue-knopf" aria-label="Menü öffnen"></button>
      </div>
    </header>

    <main class="inhalt" id="inhalt"></main>

    <nav class="reiter" id="reiter" aria-label="Bereiche"></nav>

    <div class="schleier" id="schleier"></div>
    <div class="blatt" id="blatt" role="dialog" aria-modal="true"></div>
    <div class="meldung" id="meldung" role="status"></div>
    <input type="file" id="datei" accept=".json,.txt,application/json,text/plain" hidden>
  </div>
  <noscript>Diese App braucht JavaScript.</noscript>
</body>
</html>
